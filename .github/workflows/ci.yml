name: Avora CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
      CRON_SECRET: test-cron-secret
      PAYMENTS_ALLOW_LIVE_CHARGES: "false"
      TELEPHONY_ALLOW_LIVE_CALLS: "false"
      CAMPAIGNS_ALLOW_LIVE_SENDS: "false"
      ACCOUNTING_ALLOW_LIVE_EXPORTS: "false"
      PUSH_ALLOW_LIVE_SENDS: "false"
      AI_LIVE_PROVIDER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run security:static
      - run: npm run migrations:lint
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:domain
      - run: npm run build
